flags:
- {id: hyper_connections, severity: required, detail: 'mHC with 4 residual streams: per sublayer an fp32
    [24 x 4d] mixing projection, Sinkhorn (20 iters on a 4x4 matrix), pre-collapse and post-expand. The
    coefficients computed by one sublayer are consumed by the next (Single-Pass mHC). See docs/spec/hyper_connections.md.'}
- {id: engram_tables, severity: required, detail: 'Hashed n-gram embedding on layers [1, 14]: 24 FP8 rows
    of 256 per token per layer from a 768 M-row table (197 G elements, MXFP8), then a linear projection
    and a per-stream sigmoid gate into the residual. Needs a hashed-gather DMA.'}
- {id: causal_encoder_decoder, severity: required, detail: 'CED: layers 0..19 are the encoder, 20..39
    the decoder. Prefill runs only the encoder (8B active vs 16B in decode); decoder global KV is projected
    from the encoder''s last hidden state; decoder SWA KV is rebuilt by replaying only the last 128 prompt
    tokens (SWA Bounded Replay). The scheduler and compiler need per-phase layer ranges.'}
- {id: csa2_modes, severity: required, detail: 'Every attention layer attends over a 128-token raw window
    plus top-512 entries of the global cache. Full layers (ids [2, 8, 14, 20]) build the cache and the
    indexer; Reindex layers (ids [24, 28, 32, 36]) rescore the shared index keys with their own query;
    Reuse layers read the previous top-k. Reindex layers only search a 16384-position candidate pool (Hierarchical
    Sparse Indexer).'}
- {id: fp4_kv_cache, severity: required, detail: 'Global KV is FP4 E2M1 with an E4M3 scale per 16 channels
    (0.5625 B/element); indexer K/Q are FP4 with an E8M0 scale per 32; the 128-token window stays FP8.
    890 B of global KV per token, reproduced by this descriptor.'}
- {id: dspark_in_weights, severity: warn, detail: '3 DSpark draft layers are in the main weights (128
    experts, top-3, FP4), block size 5, with a Markov head and a confidence head. Modeled as MTP layers;
    the draft/verify schedule is not.'}
- {id: router_sqrtsoftplus, severity: info, detail: Router score = sqrt(softplus(logit)); a bias selects
    experts but does not scale them; top-k weights normalized then x1.5.}
- {id: mqa_kv_equals_v, severity: info, detail: 'MQA with one 512-wide KV head; K and V are the same vector.
    Grouped low-rank output projection (o_lora 1024, 8 groups).'}
- {id: vision_tower, severity: info, detail: Vision tower excluded (text decode only).}
