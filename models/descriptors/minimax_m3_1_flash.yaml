flags:
- {id: block_sparse_attention, severity: warn, detail: 'MiniMax Sparse Attention: 16 blocks of 128 chosen
    by a 4 index query heads (one per GQA group) and ONE index key head shared by all groups (arXiv 2606.13392
    eq. 5). Every cached token is scored (dot product / sqrt(d_idx)), the score of a block is the max
    over its tokens, then top-k blocks per group; the query''s own (local) block is forced and counts
    as one of the 16 slots (init_block=0, so no sink block). Decode therefore reads all N index keys plus
    only k*block KV tokens, in every layer. vLLM serves both the KV cache and the index-key cache in NVFP4
    (--kv-cache-dtype nvfp4, indexer_kv_dtype nvfp4); indexer_decode_cp splits the decode index scan across
    TP ranks by context.'}
- {id: separate_drafter, severity: warn, detail: 'DSpark draft head (5 layers, dense FFN 12288, block
    7, Markov head, confidence head) ships in dspark/ and is not in the main weights.'}
- {id: experts_stored_nvfp4, severity: required, detail: 'quantization_config says MXFP8, but the routed
    experts are NVFP4: packed E2M1 (U8, two per byte), an FP8 E4M3 scale per 16 elements and an FP32 global
    weight scale and input scale per expert matrix (checked on the safetensors headers: w1 (3072, 3072)
    U8 with scale (3072, 384)). Attention, dense and shared-expert projections are FP8 E4M3 with an E8M0
    (U8) scale per 32 (MXFP8). Router gate is FP32.'}
