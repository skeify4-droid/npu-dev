flags:
- {id: bf16_expert_layers, severity: info, detail: 'Routed experts of layers [88, 89, 90] stay BF16 (quantization_config.modules_to_not_convert);
    all other experts are FP8.'}
- {id: csa_region_compression, severity: warn, detail: 'Full-attention layers (CSA): one shared index
    key (dim 256) and a gate z per token; every 8 tokens are pooled into one FP8 region summary by a per-dimension
    softmax over z (s_d = sum_t softmax_t(z_td) k_td). 16 index query heads in 4 groups (one per KV group)
    score summaries as sum_h w_h relu(q_h . s); each group takes the top-512 regions (4096 tokens) and
    attends to their raw BF16 K/V plus the unfinished region. Decode scores N/8 summaries.'}
- {id: head_wise_attn_gate, severity: info, detail: Per-head sigmoid gate on attention output.}
- {id: fp32_residual, severity: info, detail: fp32 residual stream and fp32 norms (fp32_residual_connection).}
- {id: mtp_layers_in_layer_types, severity: info, detail: 'layer_types has 95 entries = 92 main + 3 MTP
    layers (MTP is in the main weights, dense FFN, sliding-window attention, own output head per layer).'}
- {id: router_sigmoid_bias, severity: info, detail: Sigmoid routing with a selection-only bias (confirmed
    in inference/model.py).}
- {id: modalities, severity: info, detail: Vision tower excluded.}
